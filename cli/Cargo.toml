[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cradle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
flate2 = "1"
futures-util = "0.3"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
# WebSocket client for /frames/{id}/step's GET (upgrade) transport. Binary
# frames carry raw PTY bytes (from / to the in-guest pty-bridge); text
# frames carry cradle control events (phase, result). See cli/src/session.rs.
tokio-tungstenite = { version = "0.27", default-features = false, features = ["rustls-tls-native-roots", "connect"] }
tui-term = "0.3"
vt100 = "0.16"
