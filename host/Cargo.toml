[package]
name = "host"
version = "0.1.0"
edition = "2024"

[features]
# Server (Tiger Lake) on bare-metal KVM: pass host CPUID through unchanged.
# Default (no feature) is dev: mask AVX-512 for WSL2 nested-virt snapshot
# correctness across the laptop/desktop. See src/cpu_template.rs.
prod = []

[dependencies]
agent-protocol = { path = "../agent-protocol" }
client-protocol = { path = "../client-protocol" }
store = { path = "../store" }
async-stream = "0.3"
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
base64 = "0.22"
flate2 = "1"
fctools = { version = "0.7.0-alpha.2", features = ["tokio-runtime", "rustix-syscall-backend", "unrestricted-vmm-executor", "jailed-vmm-executor", "direct-process-spawner", "vmm-core", "vmm-executor", "vmm-process", "vm", "runtime-util", "firecracker-diff-snapshots"] }
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "1"
